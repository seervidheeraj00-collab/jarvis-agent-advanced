<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            color: #a0c4ff;
            font-weight: 300;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            animation: fadeIn 0.6s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }

        .card-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric {
            margin-bottom: 15px;
        }

        .metric-label {
            font-size: 0.9em;
            color: #a0c4ff;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .clock {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .clock-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #00d4ff;
        }

        .clock-time {
            font-size: 1.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .clock-zone {
            font-size: 0.85em;
            color: #a0c4ff;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .status-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .status-item .label {
            font-size: 0.85em;
            color: #a0c4ff;
            margin-bottom: 8px;
        }

        .status-item .value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .online {
            color: #00ff00;
        }

        .offline {
            color: #ff6b6b;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .error {
            background: rgba(255,107,107,0.2);
            border-color: #ff6b6b;
            color: #ff9999;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .success {
            background: rgba(0,255,100,0.2);
            border-color: #00ff64;
            color: #80ff9f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            color: #a0c4ff;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 JARVIS Dashboard</h1>
            <p class="subtitle">Advanced System Monitoring & Control</p>
        </header>

        <div class="dashboard">
            <!-- Status Card -->
            <div class="card">
                <div class="card-title">📊 System Status</div>
                <div id="status-content" class="loading"></div>
            </div>

            <!-- Metrics Card -->
            <div class="card">
                <div class="card-title">📈 Performance Metrics</div>
                <div id="metrics-content" class="loading"></div>
            </div>

            <!-- Agent Stats Card -->
            <div class="card">
                <div class="card-title">🎯 Agent Statistics</div>
                <div id="stats-content" class="loading"></div>
            </div>
        </div>

        <!-- World Clock -->
        <div class="card">
            <div class="card-title">🌍 World Time</div>
            <div class="clock" id="clock-content"></div>
        </div>

        <!-- Recommendations -->
        <div class="card">
            <div class="card-title">💡 AI Recommendations</div>
            <div id="recommendations-content" class="loading"></div>
        </div>

        <footer>
            <p>JARVIS v3.0 | Advanced Agent System | Real-time Monitoring</p>
            <p style="margin-top: 10px; font-size: 0.8em;">Last updated: <span id="last-update">--:--:--</span></p>
        </footer>
    </div>

    <script>
        // Auto-refresh interval
        const REFRESH_INTERVAL = 2000; // 2 seconds

        // Fetch and update status
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                const statusClass = data.status === 'online' ? 'online' : 'offline';
                const html = `
                    <div class="status-grid">
                        <div class="status-item">
                            <div class="label">Status</div>
                            <div class="value ${statusClass}">${data.status.toUpperCase()}</div>
                        </div>
                        <div class="status-item">
                            <div class="label">Commands</div>
                            <div class="value">${data.commands_processed}</div>
                        </div>
                        <div class="status-item">
                            <div class="label">Memories</div>
                            <div class="value">${data.memories_stored}</div>
                        </div>
                        <div class="status-item">
                            <div class="label">Agent</div>
                            <div class="value" style="font-size: 0.9em;">${data.agent_name}</div>
                        </div>
                    </div>
                `;
                document.getElementById('status-content').innerHTML = html;
            } catch (error) {
                console.error('Error fetching status:', error);
                document.getElementById('status-content').innerHTML = '<div class="error">Connection error</div>';
            }
        }

        // Fetch and update metrics
        async function updateMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();

                const html = `
                    <div class="metric">
                        <div class="metric-label">CPU Usage</div>
                        <div class="metric-value">${data.cpu.percent.toFixed(1)}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${data.cpu.percent}%"></div>
                        </div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Memory Usage</div>
                        <div class="metric-value">${data.memory.percent.toFixed(1)}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${data.memory.percent}%"></div>
                        </div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Disk Usage</div>
                        <div class="metric-value">${data.disk.percent.toFixed(1)}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${data.disk.percent}%"></div>
                        </div>
                    </div>
                `;
                document.getElementById('metrics-content').innerHTML = html;
            } catch (error) {
                console.error('Error fetching metrics:', error);
                document.getElementById('metrics-content').innerHTML = '<div class="error">Connection error</div>';
            }
        }

        // Fetch and update stats
        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                const html = `
                    <div class="metric">
                        <div class="metric-label">Total Commands</div>
                        <div class="metric-value">${data.total_commands}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Session Duration</div>
                        <div class="metric-value" style="font-size: 1.2em;">${data.session_duration}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Average Sentiment</div>
                        <div class="metric-value">${(data.sentiment_analysis.average_sentiment * 100).toFixed(1)}%</div>
                    </div>
                `;
                document.getElementById('stats-content').innerHTML = html;
            } catch (error) {
                console.error('Error fetching stats:', error);
                document.getElementById('stats-content').innerHTML = '<div class="error">Connection error</div>';
            }
        }

        // Fetch and update world clock
        async function updateClock() {
            try {
                const response = await fetch('/api/clock');
                const data = await response.json();

                let html = '';
                for (const [code, info] of Object.entries(data)) {
                    html += `
                        <div class="clock-item">
                            <div class="clock-time">${info.time}</div>
                            <div class="clock-zone">${code} - ${info.timezone}</div>
                            <div class="clock-zone" style="font-size: 0.8em; margin-top: 8px;">${info.day}, ${info.date}</div>
                        </div>
                    `;
                }
                document.getElementById('clock-content').innerHTML = html;
            } catch (error) {
                console.error('Error fetching clock:', error);
                document.getElementById('clock-content').innerHTML = '<div class="error">Connection error</div>';
            }
        }

        // Fetch and update recommendations
        async function updateRecommendations() {
            try {
                const response = await fetch('/api/recommendations');
                const data = await response.json();

                let html = '';
                data.recommendations.forEach(rec => {
                    html += `<div style="margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">💡 ${rec}</div>`;
                });
                document.getElementById('recommendations-content').innerHTML = html;
            } catch (error) {
                console.error('Error fetching recommendations:', error);
                document.getElementById('recommendations-content').innerHTML = '<div class="error">Connection error</div>';
            }
        }

        // Update last refresh time
        function updateLastRefresh() {
            const now = new Date();
            const time = now.toLocaleTimeString();
            document.getElementById('last-update').textContent = time;
        }

        // Initial load
        function loadAllData() {
            updateStatus();
            updateMetrics();
            updateStats();
            updateClock();
            updateRecommendations();
            updateLastRefresh();
        }

        // Load on page load
        loadAllData();

        // Auto-refresh
        setInterval(loadAllData, REFRESH_INTERVAL);
    </script>
</body>
</html>
